services:
  # Payload CMS Application
  # PostgreSQL уже развернут отдельно на сервере, подключение через DATABASE_URI
  payload-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payload-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # The encrypted file is already embedded in the image. Only its private
      # decryption key belongs in the runtime secret store / local shell.
      DOTENV_PRIVATE_KEY_PRODUCTION: ${DOTENV_PRIVATE_KEY_PRODUCTION:?required}
    healthcheck:
      # This route is force-static and never initializes Payload or Postgres.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
