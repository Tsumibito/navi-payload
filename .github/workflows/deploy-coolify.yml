name: Deploy Payload to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: navi-payload-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scoped Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"uuid":"xwk0sosw80s4sg84o8g40gok","force":false}' \
            https://app.coolify.io/api/v1/deploy
